name: spec check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spec breaks no rule
        run: python calc.py --check
      - name: Drawings and page data match the spec
        run: python tools/render.py --check
      - name: Tests
        run: python -m unittest discover -s tests -v
