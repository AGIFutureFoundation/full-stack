<line x1="294" y1="298" x2="260" y2="298" stroke="#2C002A" stroke-width="2"/><path d="M260 298 l9 -5 v10 z" fill="#2C002A"/>
<line x1="502" y1="142" x2="536" y2="142" stroke="#2C002A" stroke-width="2"/><path d="M536 142 l-9 -5 v10 z" fill="#2C002A"/>
<line x1="536" y1="298" x2="502" y2="298" stroke="#2C002A" stroke-width="2"/><path d="M502 298 l9 -5 v10 z" fill="#2C002A"/>
<line x1="744" y1="142" x2="778" y2="142" stroke="#2C002A" stroke-width="2"/><path d="M778 142 l-9 -5 v10 z" fill="#2C002A"/>
<line x1="778" y1="298" x2="744" y2="298" stroke="#2C002A" stroke-width="2"/><path d="M744 298 l9 -5 v10 z" fill="#2C002A"/>
<line x1="986" y1="142" x2="1020" y2="142" stroke="#2C002A" stroke-width="2"/><path d="M1020 142 l-9 -5 v10 z" fill="#2C002A"/>
<line x1="1020" y1="298" x2="986" y2="298" stroke="#2C002A" stroke-width="2"/><path d="M986 298 l9 -5 v10 z" fill="#2C002A"/>
<line x1="1124" y1="194" x2="1124" y2="246" stroke="#2C002A" stroke-width="2"/><path d="M1124 246 l-5 -9 h10 z" fill="#2C002A"/>
<text x="1134.0" y="224" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2C002A" text-anchor="start">yes</text>
<path d="M1124 90 V70 H398 V90" fill="none" stroke="#E33A6A" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M398 92 l-5 -9 h10 z" fill="#E33A6A"/>
<text x="761.0" y="62" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E33A6A" text-anchor="middle">no: fix the dose</text>
</svg>
